<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="rgb(0,3,76)"/>
  <!-- one number: a single solid total, which hides the shape -->
  <rect x="300" y="300" width="200" height="380" fill="none" stroke="rgba(233,234,255,0.28)" stroke-width="3"/>
  <rect x="300" y="420" width="200" height="260" fill="rgba(233,234,255,0.10)"/>
  <!-- the line the reading crosses -->
  <line x1="800" y1="150" x2="800" y2="750" stroke="rgba(233,234,255,0.16)" stroke-width="2"/>
  <!-- six scores side by side: the shape -->
  <line x1="940" y1="680" x2="1480" y2="680" stroke="rgba(233,234,255,0.22)" stroke-width="2"/>
  <g fill="rgb(99,104,218)">
    <rect x="950" y="330" width="60" height="350"/>
    <rect x="1040" y="420" width="60" height="260"/>
    <rect x="1130" y="300" width="60" height="380"/>
    <rect x="1310" y="390" width="60" height="290"/>
    <rect x="1400" y="470" width="60" height="210"/>
  </g>
  <!-- the widest gap: where to start -->
  <rect x="1220" y="590" width="60" height="90" fill="rgba(233,234,255,0.85)"/>
  <circle cx="1250" cy="550" r="10" fill="rgb(135,5,113)"/>
</svg>
