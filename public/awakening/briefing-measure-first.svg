<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="rgb(0,3,76)"/>
  <!-- the starting line: where the work begins -->
  <line x1="560" y1="200" x2="560" y2="700" stroke="rgba(233,234,255,0.16)" stroke-width="2"/>
  <!-- the measure, set down before the start -->
  <rect x="330" y="420" width="120" height="120" fill="none" stroke="rgba(233,234,255,0.85)" stroke-width="4"/>
  <line x1="450" y1="480" x2="560" y2="480" stroke="rgba(233,234,255,0.30)" stroke-width="2" stroke-dasharray="8 10"/>
  <!-- the path the work takes -->
  <path d="M560 480 C 760 480, 820 360, 1000 380 S 1220 300, 1300 300" fill="none" stroke="rgb(99,104,218)" stroke-width="6" stroke-linecap="round"/>
  <!-- the point where the result is read against the measure -->
  <rect x="1270" y="270" width="60" height="60" fill="none" stroke="rgba(233,234,255,0.85)" stroke-width="4"/>
  <circle cx="1300" cy="230" r="10" fill="rgb(135,5,113)"/>
</svg>
